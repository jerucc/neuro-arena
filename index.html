<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klassisches Snake Spiel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    canvas {
      background-color: #1e293b;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

  <!-- Haupt-Container -->
  <div class="flex flex-col items-center gap-4 max-w-lg w-full">
    
    <!-- Scoreboard -->
    <div class="w-full flex justify-between items-center p-4 bg-slate-800/80 rounded-xl border border-slate-700">
      <div>
        <h1 class="text-xl font-bold text-emerald-400">SNAKE GAME</h1>
        <p class="text-xs text-slate-400">Pfeiltasten oder WASD zum Steuern</p>
      </div>
      <div class="flex gap-6">
        <div class="text-center">
          <span class="block text-xs text-slate-400">PUNKTE</span>
          <span id="score" class="text-xl font-bold text-emerald-400">0</span>
        </div>
        <div class="text-center">
          <span class="block text-xs text-slate-400">HIGHSCORE</span>
          <span id="highscore" class="text-xl font-bold text-amber-400">0</span>
        </div>
      </div>
    </div>

    <!-- Spielfeld Canvas -->
    <div class="relative">
      <canvas id="gameCanvas" width="400" height="400" class="rounded-xl border border-slate-700"></canvas>

      <!-- Start Overlay -->
      <div id="startOverlay" class="absolute inset-0 bg-slate-950/80 rounded-xl backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-10">
        <h2 class="text-3xl font-extrabold text-emerald-400 mb-2">SNAKE</h2>
        <p class="text-sm text-slate-300 mb-6">Sammle das Futter, fresse nicht deine eigene Schlange!</p>
        <button id="startBtn" type="button" class="px-6 py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-lg shadow-lg shadow-emerald-500/20 transition-all transform hover:scale-105 cursor-pointer">
          SPIEL STARTEN
        </button>
      </div>

      <!-- Game Over Overlay -->
      <div id="gameOverOverlay" class="hidden absolute inset-0 bg-slate-950/90 rounded-xl backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-10">
        <h2 class="text-3xl font-extrabold text-rose-500 mb-2">GAME OVER</h2>
        <p class="text-slate-300 mb-4">Deine Erzielten Punkte: <span id="finalScore" class="text-emerald-400 font-bold">0</span></p>
        <button id="restartBtn" type="button" class="px-6 py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-lg shadow-lg shadow-emerald-500/20 transition-all cursor-pointer">
          NOCHMAL SPIELEN
        </button>
      </div>
    </div>

    <!-- Touch / Mobile-Steuerung -->
    <div class="grid grid-cols-3 gap-2 w-48 md:hidden mt-2">
      <div></div>
      <button id="btnUp" type="button" class="p-3 bg-slate-800 rounded-lg text-center font-bold text-xl active:bg-slate-700">▲</button>
      <div></div>
      <button id="btnLeft" type="button" class="p-3 bg-slate-800 rounded-lg text-center font-bold text-xl active:bg-slate-700">◄</button>
      <button id="btnDown" type="button" class="p-3 bg-slate-800 rounded-lg text-center font-bold text-xl active:bg-slate-700">▼</button>
      <button id="btnRight" type="button" class="p-3 bg-slate-800 rounded-lg text-center font-bold text-xl active:bg-slate-700">►</button>
    </div>

  </div>

  <script>

        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const scoreDisplay = document.getElementById('score');
        const highscoreDisplay = document.getElementById('highscore');
        const finalScoreDisplay = document.getElementById('finalScore');
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        const tileCount = canvas.width / gridSize;

        let nextDy = 0;
        let score = 0;
